[package]
name = "nearbowl-factory"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "NearBowl factory: USDC meme coins that have to be fed"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "=5.30.1"
uint = "=0.10.0"

[dev-dependencies]
near-parameters = "=0.38.1"
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
proptest = "=1.7.0"
serde_json = "1"
