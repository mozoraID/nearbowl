[package]
name = "nearbowl-tusdc"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Testnet-only mock USDC (6 decimals) for NearBowl"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
